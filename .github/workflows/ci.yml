name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Electron 44 ships Node 24.
          node-version: 24
          cache: npm

      # better-sqlite3 ships prebuilt binaries, so there is no native rebuild step.
      - name: Install dependencies
        run: npm ci

      - name: Renderer tests
        run: npm test -- --watch=false

      # Main-process tests, including the vault index against a real SQLite database.
      - name: Electron tests
        run: npm run test:electron

      - name: Build renderer
        run: npm run build

      # The preload bundle is generated and not in git, so this also proves it can be made from a clean checkout.
      - name: Build preload
        run: npm run build:preload:prod
