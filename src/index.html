<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LazyDM</title>
  <base href="/">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-kaRpLm/OkH6HYs+i8aSaZNmHTNoPOvOPenv6vPCxSq4='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: lazydm-asset:; media-src 'self' lazydm-asset:; font-src 'self' data:; connect-src 'self' ws://localhost:4200 http://localhost:4200 lazydm-asset:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="assetts/icon/lazydm_ico_short.png">

    <script>
      (function () {
        const html = document.documentElement;

        try {
          const theme = localStorage.theme;
          const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;

          const isSystem = theme === 'system' || !('theme' in localStorage);
          const isDark = theme === 'dark' || (isSystem && prefersDark);
          html.classList.toggle('dark', isDark);
          html.setAttribute('data-theme', theme ?? 'system');
        } catch (_) {}
      })();
    </script>

  </head>
<body>
  <app-root></app-root>
</body>
</html>
