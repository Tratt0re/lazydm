<ng-container arcTechId="card" #z="arcTechId">
  @let title = arcTitle();
  @if (title) {
    <div [class]="headerClasses()" data-slot="card-header">
      <div [class]="titleClasses()" [id]="titleId()" data-slot="card-title">
        <ng-container *arcStringTemplateOutlet="title">{{ title }}</ng-container
        ><span class="text-primary" aria-hidden="true">.</span>
      </div>

      @let description = arcDescription();
      @if (description) {
        <div class="text-muted-foreground text-sm" [id]="descriptionId()" data-slot="card-description">
          <ng-container *arcStringTemplateOutlet="description">{{ description }}</ng-container>
        </div>
      }
    </div>
  }

  <div [class]="bodyClasses()" data-slot="card-content">
    <ng-content />
  </div>

  <div [class]="footerClasses()" data-slot="card-footer">
    <ng-content select="[card-footer]" />
  </div>
</ng-container>
