<button
  arc-button
  class="window-no-drag"
  type="button"
  arcType="outline"
  arcSize="sm"
  arcShape="square"
  [attr.aria-label]="getThemeToggleAriaLabelKey() | translate"
  [attr.title]="getThemeToggleTitleKey() | translate"
  (click)="toggleTheme($event)"
>
  <arc-icon [arcType]="darkMode.themeMode() === EDarkModes.DARK ? 'sun' : 'moon'" class="size-4" />
</button>
