<button
  arc-button
  type="button"
  arcType="ghost"
  arcSize="sm"
  arcShape="circle"
  [attr.aria-label]="(sidebarCollapsed() ? 'sidebar.expand' : 'sidebar.collapse') | translate"
  [attr.aria-expanded]="!sidebarCollapsed()"
  (click)="onToggle()"
>
  <arc-icon arcType="panel-left" class="size-4" />
</button>
