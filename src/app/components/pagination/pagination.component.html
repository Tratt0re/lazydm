<div class="grid grid-cols-1 gap-4 md:grid-cols-[1fr_auto]">
  <div class="md:justify-self-start">
    @if (showPageSizeSelector()) {
      <div class="flex items-center gap-2">
        <span class="text-xs text-muted-foreground">{{ pageSizeLabel() }}</span>
        <arc-select
          [arcValue]="pageSizeValue()"
          [arcLabel]="pageSizeValue()"
          (arcSelectionChange)="onPageSizeSelectionChange($event)"
        >
          @for (option of normalizedPageSizeOptions(); track option) {
            <arc-select-item [arcValue]="option.toString()" [arcLabel]="option.toString()" />
          }
        </arc-select>
      </div>
    }
  </div>

  <div class="md:justify-self-end">
    @if (showTopPagination()) {
      <div class="flex items-center gap-2">
        <button
          arc-button
          type="button"
          arcType="secondary"
          [arcDisabled]="normalizedCurrentPage() <= 1"
          (click)="goToPreviousPage()"
        >
          <arc-icon arcType="chevron-left" aria-hidden="true" />
          {{ 'common.pagination.previous' | translate }}
        </button>

        <button
          arc-button
          type="button"
          arcType="secondary"
          [arcDisabled]="normalizedCurrentPage() >= normalizedTotalPages()"
          (click)="goToNextPage()"
        >
          {{ 'common.pagination.next' | translate }}
          <arc-icon arcType="chevron-right" aria-hidden="true" />
        </button>
      </div>
    }
  </div>

  <div class="md:col-span-2">
    <ng-content />
  </div>

  <p class="text-xs text-muted-foreground md:justify-self-start">
    {{ 'common.pagination.counter' | translate: { current: normalizedCurrentPage(), total: normalizedTotalPages() } }}
  </p>

  <div class="md:justify-self-end">
    <arc-pagination
      [arcPageIndex]="normalizedCurrentPage()"
      [arcTotal]="normalizedTotalPages()"
      [arcVisiblePages]="normalizedMaxVisiblePages()"
      (arcPageIndexChange)="onPageChange($event)"
    />
  </div>
</div>
