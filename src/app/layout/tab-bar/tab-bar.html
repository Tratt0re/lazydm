@if (workspace.isVisible()) {
  <div class="flex h-10 items-stretch border-b border-border bg-recessed">
    <div class="flex shrink-0 items-center gap-1 border-r border-border px-2">
      <button
        type="button"
        arc-button
        arcType="ghost"
        arcSize="sm"
        class="size-7"
        [arcDisabled]="!workspace.canGoBack()"
        [attr.aria-label]="'tabs.back' | translate"
        [arcTooltip]="'tabs.back' | translate"
        (click)="workspace.goBack()"
      >
        <arc-icon arcType="chevron-left" />
      </button>
      <button
        type="button"
        arc-button
        arcType="ghost"
        arcSize="sm"
        class="size-7"
        [arcDisabled]="!workspace.canGoForward()"
        [attr.aria-label]="'tabs.forward' | translate"
        [arcTooltip]="'tabs.forward' | translate"
        (click)="workspace.goForward()"
      >
        <arc-icon arcType="chevron-right" />
      </button>
    </div>

    <div
      role="tablist"
      cdkDropList
      cdkDropListOrientation="horizontal"
      cdkDropListLockAxis="x"
      class="flex min-w-0 flex-1 items-stretch gap-1 overflow-x-auto px-1 scrollbar-hide"
      [cdkDropListData]="workspace.tabs()"
      [attr.aria-label]="'tabs.ariaLabel' | translate"
      (cdkDropListDropped)="onDrop($event)"
    >
      @for (tab of workspace.tabs(); track tab.id) {
        @let isActive = tab.id === workspace.activeTabId();
        @let title = getTitle(tab) || ('tabs.untitled' | translate);
        <div
          cdkDrag
          cdkDragLockAxis="x"
          cdkDragPreviewClass="arc-tab-drag-preview"
          class="group flex max-w-56 min-w-28 shrink-0 items-center border-b-3 transition-colors duration-150 [&.cdk-drag-placeholder]:opacity-40 [.cdk-drop-list-dragging_&]:transition-transform"
          [class]="
            isActive
              ? 'border-primary text-foreground-strong'
              : 'border-transparent text-foreground-secondary hover:bg-accent hover:text-foreground'
          "
          [attr.data-tab-id]="tab.id"
          (auxclick)="onTabAuxClick($event, tab)"
        >
          <button
            type="button"
            role="tab"
            class="flex h-full min-w-0 flex-1 cursor-pointer items-center gap-2 pr-3 pl-3 font-mono text-[11px] tracking-[0.04em] outline-none focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ring"
            [class.font-bold]="isActive"
            [class.font-medium]="!isActive"
            [attr.aria-selected]="isActive"
            [attr.tabindex]="isActive ? 0 : -1"
            [attr.title]="title"
            (click)="workspace.activateTab(tab.id)"
            (keydown)="onTabKeyDown($event, tab)"
          >
            <arc-icon
              [arcType]="getIcon(tab)"
              class="size-3.5 shrink-0"
              [class.text-primary]="isActive"
              aria-hidden="true"
            />
            <span class="truncate">{{ title }}</span>
          </button>
          @if (workspace.canCloseTabs()) {
            <button
              type="button"
              class="mr-1 -ml-1 flex size-6 shrink-0 cursor-pointer items-center justify-center text-muted-foreground opacity-70 outline-none hover:bg-raised hover:text-foreground hover:opacity-100 focus-visible:outline-2 focus-visible:outline-ring [&_svg]:size-3.5"
              [attr.aria-label]="'tabs.close' | translate"
              (click)="onCloseClick($event, tab)"
            >
              <arc-icon arcType="x" />
            </button>
          }
        </div>
      }
    </div>

    <div class="flex shrink-0 items-center border-l border-border px-2">
      <button
        type="button"
        arc-button
        arcType="ghost"
        arcSize="sm"
        class="size-7"
        [arcDisabled]="!workspace.canOpenTab()"
        [attr.aria-label]="'tabs.new' | translate"
        [arcTooltip]="'tabs.new' | translate"
        (click)="workspace.openTab()"
      >
        <arc-icon arcType="plus" />
      </button>
    </div>
  </div>
}

<span
  class="hidden"
  arc-context-menu
  [arcContextMenuTriggerFor]="tabBarMenu"
  aria-hidden="true"
></span>

<ng-template #tabBarMenu>
  <div arc-menu-content class="w-60">
    @if (menuLinkUrl(); as url) {
      <button type="button" arc-menu-item (click)="workspace.openInActiveTab(url)">
        <arc-icon arcType="file-text" />
        {{ 'tabs.menu.open' | translate }}
      </button>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="!workspace.canOpenTab()"
        (click)="workspace.openTab(url)"
      >
        <arc-icon arcType="plus" />
        {{ 'tabs.menu.openInNewTab' | translate }}
      </button>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="!workspace.canOpenTab()"
        (click)="workspace.openTab(url, { background: true })"
      >
        <arc-icon arcType="copy-plus" />
        {{ 'tabs.menu.openInBackground' | translate }}
      </button>
    } @else if (menuTab(); as tab) {
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="!workspace.canOpenTab()"
        (click)="workspace.openTab()"
      >
        <arc-icon arcType="plus" />
        {{ 'tabs.new' | translate }}
        <arc-menu-shortcut>{{ modifierLabel }}T</arc-menu-shortcut>
      </button>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="!workspace.canOpenTab()"
        (click)="workspace.duplicateTab(tab.id)"
      >
        <arc-icon arcType="copy-plus" />
        {{ 'tabs.menu.duplicate' | translate }}
      </button>
      <div class="-mx-1 my-1 h-px bg-border-subtle" role="separator"></div>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="!workspace.canCloseTabs()"
        (click)="workspace.closeTab(tab.id)"
      >
        <arc-icon arcType="x" />
        {{ 'tabs.close' | translate }}
        @if (tab.id === workspace.activeTabId()) {
          <arc-menu-shortcut>{{ modifierLabel }}W</arc-menu-shortcut>
        }
      </button>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="workspace.tabs().length < 2"
        (click)="workspace.closeOtherTabs(tab.id)"
      >
        {{ 'tabs.menu.closeOthers' | translate }}
      </button>
      <button
        type="button"
        arc-menu-item
        [arcDisabled]="menuTabIndex() >= workspace.tabs().length - 1"
        (click)="workspace.closeTabsToRight(tab.id)"
      >
        {{ 'tabs.menu.closeToRight' | translate }}
      </button>
    }
  </div>
</ng-template>
