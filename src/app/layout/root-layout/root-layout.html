<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-9999 focus:rounded-md focus:bg-background focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:ring-2 focus:ring-ring focus:ring-offset-2"
>{{ 'common.skipToContent' | translate }}</a>

<arc-layout class="h-full overflow-hidden">

  <arc-layout class="relative min-h-0 flex-1" arcDirection="horizontal">
    @if (showSidebarOverlay()) {
      <button
        type="button"
        class="absolute inset-0 z-40 bg-foreground/20 dark:bg-foreground/15"
        [attr.aria-label]="'sidebar.close' | translate"
        (click)="closeSidebarOverlay()"
      ></button>
    }

    <app-sidebar
      [menuSections]="menuSections()"
      [isSmallScreen]="isSmallScreen()"
      [sidebarCollapsed]="sidebarCollapsed()"
      (sidebarCollapsedChange)="setSidebarCollapsed($event)"
    ></app-sidebar>

    <arc-layout
      class="min-w-0 flex-1"
      [attr.inert]="showSidebarOverlay() ? '' : null"
      [attr.aria-hidden]="showSidebarOverlay() ? 'true' : null"
    >
      <!-- One drop list group: a tab dragged from one pane's bar can be dropped in the other's. -->
      <div #panes cdkDropListGroup class="flex min-h-0 flex-1">
        <!-- The pane that is not shown (narrow window) stays mounted, so its page and edits are kept. -->
        <app-pane
          [style.display]="showLeft() ? null : 'none'"
          [style.flex]="hasSplit() && !isNarrow() ? leftGrow() + ' 1 0' : null"
          [style.min-width.px]="hasSplit() && !isNarrow() ? minPaneWidth : null"
          [sidebarCollapsed]="sidebarCollapsed()"
          (sidebarToggle)="toggleSidebar()"
          (pointerdown)="workspace.focusPane('left')"
        />
        @if (hasSplit()) {
          @if (!isNarrow()) {
            <div
              role="separator"
              aria-orientation="vertical"
              tabindex="0"
              class="group relative z-10 w-px shrink-0 cursor-col-resize bg-border outline-none focus-visible:bg-primary"
              [attr.aria-label]="'tabs.split.resize' | translate"
              [attr.aria-valuemin]="0"
              [attr.aria-valuemax]="100"
              [attr.aria-valuenow]="ratioPercent()"
              (pointerdown)="startResize($event)"
              (pointermove)="resize($event)"
              (pointerup)="endResize($event)"
              (pointercancel)="endResize($event)"
              (keydown)="onDividerKeyDown($event)"
              (dblclick)="resetRatio()"
            >
              <!-- A wider hit area than the 1px line; the line turns bronze while it is used. -->
              <span
                class="absolute inset-y-0 -left-1.5 w-3 group-hover:bg-primary/20 group-focus-visible:bg-primary/20"
                [class.bg-primary/30]="isResizing()"
              ></span>
            </div>
          }
          <app-pane
            outlet="split"
            [style.display]="showRight() ? null : 'none'"
            [style.flex]="!isNarrow() ? 1 - leftGrow() + ' 1 0' : null"
            [style.min-width.px]="!isNarrow() ? minPaneWidth : null"
            (pointerdown)="workspace.focusPane('right')"
          />
        }
      </div>
    </arc-layout>
  </arc-layout>
</arc-layout>

@if (updateService.modalOpen()) {
  <app-update-modal />
}
