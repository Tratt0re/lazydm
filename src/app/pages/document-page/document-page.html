@if (errorMessage(); as message) {
  <div class="mx-auto w-full max-w-5xl p-6">
    <arc-alert
      arcType="destructive"
      arcIcon="circle-alert"
      [arcTitle]="'document.loadError' | translate"
      [arcDescription]="message"
    />
  </div>
} @else if (!isLoading()) {
  <div class="flex min-h-80 flex-1">
    <div class="flex h-full min-h-0 min-w-0 flex-1 flex-col gap-2 p-4">
      <div class="flex shrink-0 items-center justify-between gap-3">
        <div
          class="flex items-center gap-1"
          role="group"
          [attr.aria-label]="'document.toolbar.modeAriaLabel' | translate"
        >
          @for (option of editorModes; track option.value) {
            @let isPressed = mode() === option.value;
            <button
              type="button"
              arc-button
              arcType="ghost"
              arcSize="sm"
              class="size-9 border"
              [class]="isPressed ? 'border-primary bg-raised text-primary' : 'border-transparent text-muted-foreground'"
              [attr.aria-pressed]="isPressed"
              [attr.aria-label]="option.label | translate"
              arcPosition="bottom"
              [arcTooltip]="option.label | translate"
              (click)="setMode(option.value)"
            >
              <arc-icon [arcType]="option.icon" />
            </button>
          }
        </div>

        @if (isDirty()) {
          <p class="text-[10px] font-semibold tracking-[0.12em] text-primary uppercase">
            {{ 'document.unsavedChanges' | translate }}
          </p>
        }
      </div>

      <div class="min-h-0 flex-1">
        <app-code-editor
          #editor
          [hidden]="mode() === 'reading'"
          class="h-full"
          [mode]="mode() === 'source' ? 'source' : 'live'"
          [links]="editorLinks()"
          [linkTargets]="linkTargets()"
          [sourcePath]="document()?.path ?? ''"
          [documentKey]="notePath()"
          [initialContent]="document()?.content ?? ''"
          [placeholderText]="'document.editorPlaceholder' | translate"
          (contentChange)="editedContent.set($event)"
          (saveRequested)="save()"
          (linkOpen)="openRoute($event)"
          (brokenLinkOpen)="openBrokenLinkMenu($event)"
        />
        <app-broken-link-menu (fixBrokenLink)="onFixBrokenLink($event)" />
        @if (mode() === 'reading') {
          <app-document-preview
            class="h-full"
            [body]="previewBody()"
            [links]="document()?.links ?? []"
            [sourcePath]="document()?.path ?? ''"
            (fixBrokenLink)="onFixBrokenLink($event)"
          />
        }
      </div>
    </div>

    <!-- Kept mounted so opening and closing can slide instead of re-rendering. -->
    <div
      class="shrink-0 overflow-hidden transition-[width,opacity] duration-200 ease-out motion-reduce:transition-none"
      [class]="isLinksPanelOpen() ? 'w-84 opacity-100' : 'w-0 opacity-0'"
      [attr.inert]="isLinksPanelOpen() ? null : ''"
      [attr.aria-hidden]="isLinksPanelOpen() ? null : 'true'"
    >
      <div class="h-full py-4 pr-4">
        <app-document-links-panel [path]="notePath()" (fixBrokenLink)="onFixBrokenLink($event)" />
      </div>
    </div>
  </div>
}
