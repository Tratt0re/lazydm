@if (errorMessage(); as message) {
  <div class="mx-auto w-full max-w-5xl p-6">
    <arc-alert
      arcType="destructive"
      arcIcon="circle-alert"
      [arcTitle]="'document.loadError' | translate"
      [arcDescription]="message"
    />
  </div>
} @else if (!isLoading()) {
  <div class="flex min-h-80 flex-1">
    <div class="flex h-full min-h-0 min-w-0 flex-1 flex-col gap-2 py-4">
      <div class="flex shrink-0 items-center justify-between gap-3">
        <div
          class="flex items-center gap-1"
          role="group"
          [attr.aria-label]="'document.toolbar.modeAriaLabel' | translate"
        >
          @for (option of editorModes(); track option.value) {
            @let isPressed = mode() === option.value;
            <button
              type="button"
              arc-button
              arcType="ghost"
              arcSize="sm"
              class="size-9 border"
              [class]="isPressed ? 'border-primary bg-raised text-primary' : 'border-transparent text-muted-foreground'"
              [attr.aria-pressed]="isPressed"
              [attr.aria-label]="option.label | translate"
              arcPosition="bottom"
              [arcTooltip]="option.label | translate"
              (click)="setMode(option.value)"
            >
              <arc-icon [arcType]="option.icon" />
            </button>
          }
        </div>

        <div class="flex items-center gap-3">
          @if (isDirty()) {
            <p class="text-[11px] font-semibold tracking-[0.12em] text-primary uppercase">
              {{ 'document.unsavedChanges' | translate }}
            </p>
          }
          @if (mode() !== 'source') {
            <!-- The properties box is collapsed by default; this opens it, in Live and in Reading (remembered on this device). -->
            <button
              type="button"
              arc-button
              arcType="ghost"
              arcSize="sm"
              class="size-9 border"
              [class]="isPropertiesOpen() ? 'border-primary bg-raised text-primary' : 'border-transparent text-muted-foreground'"
              [attr.aria-pressed]="isPropertiesOpen()"
              [attr.aria-label]="'document.properties.toggle' | translate"
              arcPosition="bottom"
              [arcTooltip]="'document.properties.toggle' | translate"
              (click)="toggleProperties()"
            >
              <arc-icon arcType="table-properties" />
            </button>
          }
          <button
            type="button"
            arc-button
            arcType="ghost"
            arcSize="sm"
            class="size-9 border border-transparent text-muted-foreground"
            [attr.aria-label]="'document.reference.button' | translate"
            arcPosition="bottom"
            [arcTooltip]="'document.reference.button' | translate"
            (click)="openEditorReference()"
          >
            <arc-icon arcType="book-a" />
          </button>
        </div>
      </div>

      <div class="min-h-0 flex-1">
        <app-code-editor
          #editor
          [hidden]="mode() === 'reading'"
          class="h-full"
          [mode]="mode() === 'source' ? 'source' : 'live'"
          [links]="liveLinks()"
          [linkTargets]="linkTargets()"
          [sourcePath]="document()?.path ?? ''"
          [showProperties]="isPropertiesOpen()"
          [pageTitle]="document()?.title ?? ''"
          [documentKey]="notePath()"
          [initialContent]="document()?.content ?? ''"
          [placeholderText]="'document.editorPlaceholder' | translate"
          (contentChange)="editedContent.set($event)"
          (saveRequested)="save()"
          (linkOpen)="openRoute($event)"
          (brokenLinkOpen)="openBrokenLinkMenu($event)"
          (filesPasted)="onFilesPasted($event)"
          (importFileRequested)="importFiles()"
          [playingAudioPath]="noteAudio.playingPath()"
          [audioVolume]="noteAudio.volume()"
          [audioDurations]="noteAudio.durations()"
          [audioProgress]="noteAudio.progress()"
          [mediaLabels]="mediaLabels"
          [linkPreviewLabel]="linkPreviewLabel"
          [imagePreviewLabel]="imagePreviewLabel"
          [fileOpenLabel]="fileOpenLabel"
          (assetAction)="onAssetAction($event)"
          (linkPreview)="toggleLinkPreview($event)"
        />
        <app-broken-link-menu (fixBrokenLink)="onFixBrokenLink($event)" />
        @if (mode() === 'reading') {
          <app-document-preview
            class="h-full"
            [body]="previewBody()"
            [properties]="previewProperties()"
            [showProperties]="isPropertiesOpen()"
            [links]="liveLinks()"
            [sourcePath]="document()?.path ?? ''"
            [playingAudioPath]="noteAudio.playingPath()"
            [audioProgress]="noteAudio.progress()"
            [audioVolume]="noteAudio.volume()"
            [audioDurations]="noteAudio.durations()"
            [mediaLabels]="mediaLabels"
            [linkPreviewLabel]="linkPreviewLabel"
            [imagePreviewLabel]="imagePreviewLabel"
            [fileOpenLabel]="fileOpenLabel"
            (fixBrokenLink)="onFixBrokenLink($event)"
            (assetAction)="onAssetAction($event)"
            (linkPreview)="toggleLinkPreview($event)"
          />
        }
        <app-link-preview-card />
      </div>
    </div>

    <!-- Kept mounted so opening and closing can slide instead of re-rendering. -->
    <div
      class="shrink-0 overflow-hidden transition-[width,opacity] duration-200 ease-out motion-reduce:transition-none"
      [class]="isLinksPanelOpen() ? 'w-84 opacity-100' : 'w-0 opacity-0'"
      [attr.inert]="isLinksPanelOpen() ? null : ''"
      [attr.aria-hidden]="isLinksPanelOpen() ? null : 'true'"
    >
      <div class="h-full py-4 pr-4">
        <app-document-links-panel
          [path]="notePath()"
          (fixBrokenLink)="onFixBrokenLink($event)"
          (linkCount)="linkCount.set($event)"
        />
      </div>
    </div>
  </div>
}
