<div class="relative flex flex-col gap-4 p-6" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" arcTechId="alert-dialog" #z="arcTechId">
  @if (config.arcClosable) {
    <button
      type="button"
      arc-button
      arcType="ghost"
      arcSize="sm"
      class="absolute top-4 right-4 z-10 border border-input"
      (click)="onCancelClick()"
    >
      <arc-icon arcType="x" />
    </button>
  }

  @if (config.arcTitle || config.arcDescription) {
    <header class="flex flex-col gap-2 text-center sm:text-left">
      @if (config.arcTitle) {
        <h2
          data-testid="arc-alert-title"
          [id]="titleId()"
          class="pr-12 text-left font-display text-[35px] leading-none font-extrabold tracking-[0.025em] text-foreground-strong uppercase"
        >
          {{ config.arcTitle }}
        </h2>
        <div class="arc-engraved-divider mt-2" aria-hidden="true"><span></span></div>
      }

      @if (config.arcDescription) {
        <p data-testid="arc-alert-description" [id]="descriptionId()" class="text-muted-foreground text-sm">
          {{ config.arcDescription }}
        </p>
      }
    </header>
  }

  <main>
    <ng-template cdkPortalOutlet />

    @if (isStringContent()) {
      <div data-testid="arc-alert-content" [innerHTML]="config.arcContent"></div>
    }
  </main>

  <footer class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
    @if (config.arcCancelText !== null) {
      <button type="button" data-testid="arc-alert-cancel-button" arc-button arcType="outline" (click)="onCancelClick()">
        {{ config.arcCancelText || 'Cancel' }}
      </button>
    }

    @if (config.arcOkText !== null) {
      <button
        type="button"
        data-testid="arc-alert-ok-button"
        arc-button
        [arcType]="config.arcOkDestructive ? 'destructive' : 'default'"
        [arcDisabled]="config.arcOkDisabled"
        (click)="onOkClick()"
      >
        {{ config.arcOkText || 'Continue' }}
      </button>
    }
  </footer>
</div>
